<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BiteDash – Local Food Ordering App</title>
  <style>
    :root {
  --bg: #f5f7fb;
  --surface: #ffffff;
  --text: #172033;
  --muted: #667085;
  --border: #e6e9f2;
  --primary: #ff7a00;
  --primary-dark: #e86c00;
  --shadow: 0 8px 24px rgba(16, 24, 40, 0.08);
  --radius: 18px;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: var(--bg);
  color: var(--text);
}

body {
  min-height: 100vh;
}

.app-shell {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background: var(--bg);
}

.topbar {
  padding: 18px 16px 12px;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
}

.eyebrow {
  margin: 0 0 4px;
  font-size: 12px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--primary-dark);
  font-weight: 700;
}

h1 {
  margin: 0;
  font-size: 24px;
  line-height: 1.15;
}

.cart-badge {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 10px 14px;
  font-size: 14px;
  box-shadow: var(--shadow);
  white-space: nowrap;
}

.content {
  flex: 1;
  padding: 0 16px 84px;
}

.screen {
  display: none;
}

.screen.active {
  display: block;
}

.section-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 14px;
  margin-bottom: 14px;
}

.label {
  display: block;
  font-size: 13px;
  font-weight: 700;
  margin-bottom: 8px;
  color: var(--text);
}

.input {
  width: 100%;
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 14px 14px;
  font-size: 16px;
  outline: none;
  background: #fff;
}

.input:focus {
  border-color: var(--primary);
}

.restaurant-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 14px;
}

.restaurant-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
}

.restaurant-image {
  width: 100%;
  height: 180px;
  object-fit: cover;
  display: block;
}

.restaurant-body {
  padding: 14px;
}

.restaurant-title {
  margin: 0 0 6px;
  font-size: 18px;
}

.restaurant-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 14px;
  color: var(--muted);
  font-size: 14px;
}

.rating-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: #fff7ed;
  color: #9a4d00;
  border-radius: 999px;
  padding: 6px 10px;
  font-weight: 700;
}

.add-btn,
.primary-btn,
.nav-btn {
  min-height: 48px;
  border: none;
  border-radius: 14px;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
}

.add-btn,
.primary-btn {
  width: 100%;
  background: var(--primary);
  color: #fff;
}

.add-btn:active,
.primary-btn:active {
  background: var(--primary-dark);
}

.cart-list {
  display: grid;
  gap: 12px;
  margin-bottom: 14px;
}

.cart-item {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 14px;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
}

.cart-item h3 {
  margin: 0 0 4px;
  font-size: 16px;
}

.cart-item p {
  margin: 0;
  font-size: 14px;
  color: var(--muted);
}

.cart-meta {
  text-align: right;
  font-size: 14px;
  white-space: nowrap;
}

.summary-card {
  margin-top: 2px;
}

.summary-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 16px;
}

.bottom-nav {
  position: sticky;
  bottom: 0;
  background: rgba(245, 247, 251, 0.96);
  backdrop-filter: blur(10px);
  border-top: 1px solid var(--border);
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  padding: 10px 16px 14px;
}

.nav-btn {
  background: #e9edf7;
  color: var(--text);
}

.nav-btn.active {
  background: var(--text);
  color: #fff;
}

.empty-state {
  background: var(--surface);
  border: 1px dashed var(--border);
  border-radius: var(--radius);
  padding: 18px;
  text-align: center;
  color: var(--muted);
  box-shadow: var(--shadow);
}

@media (min-width: 720px) {
  .app-shell {
    max-width: 420px;
  }
}
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">BiteDash</p>
        <h1>Local Food Ordering</h1>
      </div>
      <div class="cart-badge">
        Items: <span id="cartCount">0</span>
      </div>
    </header>

    <main class="content">
      <!-- Screen 1: Discovery -->
      <section id="discoveryScreen" class="screen active">
        <div class="section-card">
          <label for="searchInput" class="label">Search restaurants</label>
          <input
            type="search"
            id="searchInput"
            class="input"
            placeholder="Type a restaurant name"
          />
        </div>

        <div id="restaurantList" class="restaurant-grid"></div>
      </section>

      <!-- Screen 2: Cart / Checkout -->
      <section id="cartScreen" class="screen">
        <div id="cartItems" class="cart-list"></div>

        <div class="section-card summary-card">
          <div class="summary-row">
            <span>Total Price</span>
            <strong id="totalPrice">₱0</strong>
          </div>
        </div>

        <div class="section-card">
          <label for="addressInput" class="label">Delivery address</label>
          <input
            type="text"
            id="addressInput"
            class="input"
            placeholder="Enter delivery address"
          />
        </div>

        <button id="placeOrderBtn" class="primary-btn">Place Order</button>
      </section>
    </main>

    <nav class="bottom-nav">
      <button id="navDiscovery" class="nav-btn active" type="button">Discovery</button>
      <button id="navCart" class="nav-btn" type="button">Cart</button>
    </nav>
  </div>

  <script>
    const restaurants = [
  {
    id: 1,
    name: "Barkada Bites",
    rating: 4.8,
    itemName: "Grilled Chicken Meal",
    price: 120
  },
  {
    id: 2,
    name: "Luna Eats",
    rating: 4.6,
    itemName: "Beef Rice Bowl",
    price: 135
  },
  {
    id: 3,
    name: "Timpla Hub",
    rating: 4.7,
    itemName: "Pork Sisig Plate",
    price: 145
  },
  {
    id: 4,
    name: "Kanto Kitchen",
    rating: 4.5,
    itemName: "Fried Chicken Set",
    price: 110
  }
];

const cart = [];

const restaurantList = document.getElementById("restaurantList");
const searchInput = document.getElementById("searchInput");
const cartItems = document.getElementById("cartItems");
const totalPrice = document.getElementById("totalPrice");
const cartCount = document.getElementById("cartCount");
const addressInput = document.getElementById("addressInput");
const placeOrderBtn = document.getElementById("placeOrderBtn");

const discoveryScreen = document.getElementById("discoveryScreen");
const cartScreen = document.getElementById("cartScreen");
const navDiscovery = document.getElementById("navDiscovery");
const navCart = document.getElementById("navCart");

function makeRestaurantImage(title, startColor, endColor) {
  const svg = `
    <svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#${startColor}" />
          <stop offset="100%" stop-color="#${endColor}" />
        </linearGradient>
      </defs>
      <rect width="800" height="500" fill="url(#g)" rx="28" ry="28" />
      <circle cx="650" cy="110" r="70" fill="rgba(255,255,255,0.18)" />
      <circle cx="130" cy="360" r="95" fill="rgba(255,255,255,0.16)" />
      <text x="50%" y="48%" text-anchor="middle" dominant-baseline="middle"
            fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700">
        ${title}
      </text>
    </svg>
  `;
  return `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(svg)}`;
}

const restaurantImages = [
  makeRestaurantImage("Barkada Bites", "ff7a00", "ffad5c"),
  makeRestaurantImage("Luna Eats", "6c5ce7", "9b8cff"),
  makeRestaurantImage("Timpla Hub", "00b894", "66d9c9"),
  makeRestaurantImage("Kanto Kitchen", "e17055", "ff9f7f")
];

function getFilteredRestaurants() {
  const query = searchInput.value.trim().toLowerCase();
  return restaurants.filter((restaurant) =>
    restaurant.name.toLowerCase().includes(query)
  );
}

function renderRestaurants() {
  const data = getFilteredRestaurants();

  if (data.length === 0) {
    restaurantList.innerHTML = `
      <div class="empty-state">
        No restaurants matched your search.
      </div>
    `;
    return;
  }

  restaurantList.innerHTML = data
    .map((restaurant) => {
      const imageIndex = restaurants.findIndex((r) => r.id === restaurant.id);
      return `
        <article class="restaurant-card">
          <img class="restaurant-image" src="${restaurantImages[imageIndex]}" alt="${restaurant.name}" />
          <div class="restaurant-body">
            <h2 class="restaurant-title">${restaurant.name}</h2>
            <div class="restaurant-meta">
              <span class="rating-pill">★ ${restaurant.rating}</span>
              <span>Delivery item available</span>
            </div>
            <button class="add-btn" type="button" data-id="${restaurant.id}">
              Add to Cart
            </button>
          </div>
        </article>
      `;
    })
    .join("");

  document.querySelectorAll(".add-btn").forEach((button) => {
    button.addEventListener("click", () => {
      const id = Number(button.dataset.id);
      addToCart(id);
    });
  });
}

function addToCart(restaurantId) {
  const restaurant = restaurants.find((item) => item.id === restaurantId);
  if (!restaurant) return;

  const existing = cart.find((item) => item.id === restaurant.id);

  if (existing) {
    existing.qty += 1;
  } else {
    cart.push({
      id: restaurant.id,
      name: restaurant.name,
      itemName: restaurant.itemName,
      price: restaurant.price,
      qty: 1
    });
  }

  renderCart();
}

function renderCart() {
  const totalItems = cart.reduce((sum, item) => sum + item.qty, 0);
  cartCount.textContent = totalItems;

  if (cart.length === 0) {
    cartItems.innerHTML = `
      <div class="empty-state">
        Your cart is empty.
      </div>
    `;
    totalPrice.textContent = "₱0";
    return;
  }

  cartItems.innerHTML = cart
    .map((item) => {
      const subtotal = item.price * item.qty;
      return `
        <article class="cart-item">
          <div>
            <h3>${item.name}</h3>
            <p>${item.itemName}</p>
          </div>
          <div class="cart-meta">
            <div>Qty: ${item.qty}</div>
            <div>₱${subtotal}</div>
          </div>
        </article>
      `;
    })
    .join("");

  const total = cart.reduce((sum, item) => sum + item.price * item.qty, 0);
  totalPrice.textContent = `₱${total}`;
}

function switchScreen(screenName) {
  const discoveryActive = screenName === "discovery";
  discoveryScreen.classList.toggle("active", discoveryActive);
  cartScreen.classList.toggle("active", !discoveryActive);
  navDiscovery.classList.toggle("active", discoveryActive);
  navCart.classList.toggle("active", !discoveryActive);
}

searchInput.addEventListener("input", renderRestaurants);

navDiscovery.addEventListener("click", () => switchScreen("discovery"));
navCart.addEventListener("click", () => switchScreen("cart"));

placeOrderBtn.addEventListener("click", () => {
  if (cart.length === 0) {
    alert("Your cart is empty.");
    return;
  }

  const address = addressInput.value.trim();
  if (!address) {
    alert("Please enter a delivery address.");
    return;
  }

  const total = cart.reduce((sum, item) => sum + item.price * item.qty, 0);
  const totalItems = cart.reduce((sum, item) => sum + item.qty, 0);

  alert(
    `Order placed successfully!\n\nItems: ${totalItems}\nTotal: ₱${total}\nDelivery Address: ${address}`
  );

  cart.length = 0;
  addressInput.value = "";
  renderCart();
});

renderRestaurants();
renderCart();
  </script>
</body>
</html>
