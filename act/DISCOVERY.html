<!DOCTYPE html>
<html>
<head>
<title>MealDash - Discover</title>
<style>
body {
    font-family: 'Segoe UI', sans-serif;
    margin: 0;
    background: #f4f6f8;
}
.header {
    background: #1e2a38;
    color: white;
    padding: 15px 30px;
    display: flex;
    justify-content: space-between;
}
.search-box input {
    padding: 10px;
    width: 300px;
    border-radius: 6px;
    border: none;
}
.container {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 25px;
    padding: 30px;
}
.card {
    background: white;
    border-radius: 10px;
    overflow: hidden;
    transition: transform 0.2s;
}
.card:hover {
    transform: scale(1.03);
}
.card img {
    width: 100%;
    height: 160px;
}
.card-body {
    padding: 15px;
}
.rating {
    color: #ff9800;
}
</style>
</head>

<body>

<div class="header">
    <h2>MealDash</h2>
    <div class="search-box">
        <input type="text" placeholder="Search restaurants...">
    </div>
</div>

<div class="container">
    <div class="card">
        <img src="food.jpg">
        <div class="card-body">
            <h3>Spice Hub</h3>
            <p class="rating">★★★★☆</p>
            <p>Authentic local cuisine</p>
        </div>
    </div>

    <div class="card">
        <img src="food.jpg">
        <div class="card-body">
            <h3>Grill Station</h3>
            <p class="rating">★★★★★</p>
            <p>BBQ and grilled favorites</p>
        </div>
    </div>
</div>

</body>
</html>
