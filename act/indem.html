<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MealDash</title>

<style>
/* ===== GLOBAL ===== */
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #f0f2f5, #e4e8ec);
    color: #222;
}

h1, h2, h3 {
    margin: 0;
}

button {
    cursor: pointer;
}

/* ===== HEADER ===== */
.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 40px;
    background: rgba(255,255,255,0.6);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid #ddd;
}

.logo {
    font-size: 22px;
    font-weight: bold;
    letter-spacing: 1px;
}

.search-box {
    width: 300px;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #ccc;
}

/* ===== NAV SWITCH ===== */
.nav {
    padding: 15px 40px;
}

.nav button {
    margin-right: 10px;
    padding: 10px 18px;
    border: none;
    border-radius: 8px;
    background: #333;
    color: white;
}

/* ===== DISCOVERY ===== */
.discovery {
    padding: 30px 40px;
}

.restaurant-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 25px;
}

.card {
    background: white;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 10px 20px rgba(0,0,0,0.08);
    transition: 0.3s;
}

.card:hover {
    transform: translateY(-6px);
}

.card img {
    width: 100%;
    height: 160px;
    object-fit: cover;
}

.card-body {
    padding: 15px;
}

.rating {
    color: #ffaa00;
    font-size: 14px;
}

/* ===== CHECKOUT ===== */
.checkout {
    display: none;
    padding: 30px 40px;
}

.checkout-layout {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 30px;
}

.cart-box, .summary-box {
    background: white;
    padding: 20px;
    border-radius: 16px;
    box-shadow: 0 10px 20px rgba(0,0,0,0.08);
}

.cart-item {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr;
    margin-bottom: 15px;
    align-items: center;
}

.cart-item input {
    width: 50px;
}

.summary-box textarea {
    width: 100%;
    height: 80px;
    margin-top: 10px;
    border-radius: 8px;
    border: 1px solid #ccc;
    padding: 10px;
}

.total {
    font-size: 20px;
    margin-bottom: 20px;
}

.place-btn {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, #00c853, #009624);
    color: white;
    font-size: 16px;
    transition: 0.2s;
}

.place-btn:hover {
    opacity: 0.9;
}

/* ===== RESPONSIVE SAFETY ===== */
@media(max-width: 1200px){
    .restaurant-grid {
        grid-template-columns: repeat(2,1fr);
    }
}

</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
    <div class="logo">BiteDash</div>
    <input class="search-box" placeholder="Search restaurants...">
</div>

<!-- NAV -->
<div class="nav">
    <button onclick="showDiscovery()">Discover</button>
    <button onclick="showCheckout()">Cart / Checkout</button>
</div>

<!-- DISCOVERY PAGE -->
<div class="discovery" id="discovery">

    <h2 style="margin-bottom:20px;">Explore Restaurants</h2>

    <div class="restaurant-grid">

        <div class="card">
            <img src="https://picsum.photos/400/200?1">
            <div class="card-body">
                <h3>Urban Eats</h3>
                <p class="rating">⭐ 4.6</p>
                <p>Modern meals with fast delivery.</p>
            </div>
        </div>

        <div class="card">
            <img src="https://picsum.photos/400/200?2">
            <div class="card-body">
                <h3>Daily Bites</h3>
                <p class="rating">⭐ 4.3</p>
                <p>Affordable everyday favorites.</p>
            </div>
        </div>

        <div class="card">
            <img src="https://picsum.photos/400/200?3">
            <div class="card-body">
                <h3>Spice Route</h3>
                <p class="rating">⭐ 4.7</p>
                <p>Rich flavors and spicy dishes.</p>
            </div>
        </div>

    </div>

</div>

<!-- CHECKOUT PAGE -->
<div class="checkout" id="checkout">

    <h2 style="margin-bottom:20px;">Your Order</h2>

    <div class="checkout-layout">

        <!-- CART -->
        <div class="cart-box">

            <div class="cart-item">
                <span>Burger</span>
                <input type="number" value="1" onchange="updateTotal()">
                <span>₱120</span>
            </div>

            <div class="cart-item">
                <span>Fries</span>
                <input type="number" value="2" onchange="updateTotal()">
                <span>₱80</span>
            </div>

        </div>

        <!-- SUMMARY -->
        <div class="summary-box">

            <div class="total" id="total">Total: ₱280</div>

            <label>Delivery Address</label>
            <textarea placeholder="Enter your delivery location..."></textarea>

            <button class="place-btn" onclick="placeOrder()">
                Place Order
            </button>

        </div>

    </div>

</div>

<script>

/* PAGE SWITCH */
function showDiscovery() {
    document.getElementById("discovery").style.display = "block";
    document.getElementById("checkout").style.display = "none";
}

function showCheckout() {
    document.getElementById("discovery").style.display = "none";
    document.getElementById("checkout").style.display = "block";
}

/* TOTAL CALCULATION */
function updateTotal() {
    const inputs = document.querySelectorAll(".cart-item input");
    const prices = [120, 80];

    let total = 0;

    inputs.forEach((input, index) => {
        total += input.value * prices[index];
    });

    document.getElementById("total").innerText = "Total: ₱" + total;
}

/* ORDER ACTION */
function placeOrder() {
    alert("Order successfully placed!");
}

</script>

</body>
</html>
