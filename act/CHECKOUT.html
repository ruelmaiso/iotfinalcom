<!DOCTYPE html>
<html>
<head>
    <title>Bite Dash - Checkout</title>
    <style>
        .checkout-container {
    display: flex;
    gap: 30px;
    padding: 20px;
}

.cart-items {
    flex: 2;
    background: white;
    padding: 20px;
}

.item {
    display: flex;
    justify-content: space-between;
    margin-bottom: 15px;
}

.summary {
    flex: 1;
    background: white;
    padding: 20px;
}

button {
    width: 100%;
    padding: 15px;
    background: green;
    color: white;
    border: none;
    font-size: 16px;
}
    </style>
</head>
<body>

<h2 class="title">Your Cart</h2>

<div class="checkout-container">

    <div class="cart-items">
        <div class="item">
            <span>Burger</span>
            <input type="number" value="1">
            <span>₱120</span>
        </div>

        <div class="item">
            <span>Fries</span>
            <input type="number" value="2">
            <span>₱80</span>
        </div>
    </div>

    <div class="summary">
        <h3>Total: ₱280</h3>

        <div class="address">
            <label>Delivery Address</label>
            <textarea></textarea>
        </div>

        <button onclick="placeOrder()">Place Order</button>
    </div>

</div>

<script>
function placeOrder() {
    alert("Order Placed Successfully!");
}
</script>

</body>
</html>
